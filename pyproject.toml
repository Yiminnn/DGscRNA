[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dgscrna"
version = "2.0.0rc1"
description = "Original R DG-scRNA workflow with Python deep-learning refinement and one command-line interface"
authors = [
    { name = "Yimin Liu", email = "yiminliu.career@gmail.com" }
]
license = { text = "GPL-3.0" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["single-cell", "RNA-seq", "cell-type", "annotation", "bioinformatics"]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=1.5.0",
    "torch>=2.0.0",
]

[project.scripts]
dgscrna = "dgscrna.reference.cli:main"

[project.optional-dependencies]
anndata = ["anndata>=0.9.0"]
legacy = [
    "scanpy>=1.9.0",
    "anndata>=0.8.0",
    "scikit-learn>=1.0.0",
    "torchmetrics>=0.7.0",
    "hdbscan>=0.8.0",
    "leidenalg>=0.8.0",
    "harmonypy>=0.0.5",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "tqdm>=4.62.0",
    "joblib>=1.1.0",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.800",
    "bump2version>=1.0.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Yiminnn/DGscRNA"
Repository = "https://github.com/Yiminnn/DGscRNA.git"
"Bug Tracker" = "https://github.com/Yiminnn/DGscRNA/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dgscrna*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
dgscrna = ["data/*", "reference/backend/*.R", "reference/backend/*.json"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
